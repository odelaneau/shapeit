{% set name = "shapeit5" %}
{% set version = "5.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_url: https://github.com/ltalignani/shapeit.git
  git_rev: dce5c198392c292dc5f1e7954ad300e663215be8
  # apple-silicon-port @ dce5c19 — once merged upstream, re-point to a
  # git_tag on odelaneau/shapeit (5.1.2).
  sha256: ignored

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('shapeit5', max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
  host:
    - boost-cpp
    - libcurl
    - libdeflate
    - bzip2
    - htslib
    - xz
    - zlib
  run:
    - boost-cpp
    - htslib
    - libcurl
    - libdeflate
    - bzip2
    - xz
    - zlib

test:
  commands:
    - SHAPEIT5_phase_common --help
    - SHAPEIT5_phase_rare --help
    - SHAPEIT5_switch --help
    - SHAPEIT5_ligate --help
    - SHAPEIT5_xcftools

about:
  home: https://odelaneau.github.io/shapeit
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'SHAPEIT5 estimates haplotypes in large genotype datasets (WGS, WES, SNP array), with a special focus on rare variants.'
  description: |
    SHAPEIT5 estimates haplotypes in large datasets, with a special focus on
    rare variants. The HMM engine uses native ARM NEON SIMD kernels on Apple
    Silicon (no sse2neon emulation) and AVX2/FMA on x86_64.
  dev_url: https://github.com/odelaneau/shapeit
  doc_url: https://odelaneau.github.io/shapeit

extra:
  identifiers:
    - doi:10.1101/2022.10.19.512867
    - biotools:shapeit5
  skip-lints:
    - uses_vcs_url
    - stdlib
